<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRGPT - Giriş / Kayıt</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0d0d12;
            --text-primary: #ffffff;
            --text-secondary: #9e9eb3;
            --accent: #6366f1;
            --input-bg: #1c1c24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            background-image: radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%), radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.15), transparent 25%);
            color: var(--text-primary); 
            height: 100vh; 
            display: flex; 
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .auth-container {
            background: rgba(28, 28, 36, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 30px rgba(99, 102, 241, 0.15);
            position: relative;
            overflow: hidden;
        }

        .logo-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .logo-svg { width: 45px; height: 45px; filter: drop-shadow(0 0 10px var(--accent)); }
        .logo-text { font-size: 28px; font-weight: 800; background: linear-gradient(to right, #fff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Sekme Butonları */
        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 30px;
            position: relative;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            z-index: 2;
            transition: color 0.3s;
        }
        .tab-btn.active { color: white; }
        
        /* Kayan Arka Plan (Slider) */
        .slider {
            position: absolute;
            top: 5px;
            left: 5px;
            width: calc(50% - 5px);
            height: calc(100% - 10px);
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border-radius: 8px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .slider.register { transform: translateX(100%); }

        /* Form Alanları */
        .form-container { position: relative; height: 260px; }
        .form-box {
            position: absolute;
            width: 100%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;
            transform: translateX(20px);
        }
        .form-box.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .input-group { margin-bottom: 20px; position: relative; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #666; }
        input { 
            width: 100%; 
            padding: 14px 14px 14px 45px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: var(--input-bg); 
            color: white; 
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }

        button.submit-btn { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); 
            border: none; 
            color: white; 
            border-radius: 12px; 
            font-size: 16px;
            font-weight: 600;
            cursor: pointer; 
            transition: all 0.3s; 
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        button.submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); }

        /* Uyarı Mesajları */
        .flash-msg { 
            background: rgba(255, 107, 107, 0.1); 
            border: 1px solid rgba(255, 107, 107, 0.3); 
            color: #ff6b6b; 
            padding: 10px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            text-align: center; 
            font-size: 14px;
            animation: fadeIn 0.3s;
        }
        .flash-success {
            background: rgba(16, 163, 127, 0.1); 
            border: 1px solid rgba(16, 163, 127, 0.3); 
            color: #10a37f; 
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 10L85 30V70L50 90L15 70V30L50 10Z" stroke="url(#paint0_linear)" stroke-width="6" fill="rgba(99, 102, 241, 0.1)"/>
                <circle cx="50" cy="50" r="15" fill="url(#paint0_linear)"/>
                <path d="M50 30V40M50 60V70M30 50H40M60 50H70" stroke="url(#paint0_linear)" stroke-width="4" stroke-linecap="round"/>
                <defs>
                    <linearGradient id="paint0_linear" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#6366f1"/>
                        <stop offset="1" stop-color="#a855f7"/>
                    </linearGradient>
                </defs>
            </svg>
            <span class="logo-text">TRGPT</span>
        </div>

        <!-- Uyarı Mesajları -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-msg {% if category == 'success' %}flash-success{% endif %}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- Sekmeler -->
        <div class="tabs">
            <div class="slider" id="slider"></div>
            <button class="tab-btn active" onclick="switchTab('login')">Giriş Yap</button>
            <button class="tab-btn" onclick="switchTab('register')">Kayıt Ol</button>
        </div>

        <!-- Formlar -->
        <div class="form-container">
            <!-- Giriş Formu -->
            <form method="POST" class="form-box active" id="login-form">
                <input type="hidden" name="action" value="login">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Kullanıcı Adı" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Şifre" required>
                </div>
                <button type="submit" class="submit-btn">Giriş Yap</button>
            </form>

            <!-- Kayıt Formu -->
            <form method="POST" class="form-box" id="register-form">
                <input type="hidden" name="action" value="register">
                <div class="input-group">
                    <i class="fas fa-user-plus"></i>
                    <input type="text" name="username" placeholder="Yeni Kullanıcı Adı" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Şifre (En az 4 karakter)" required>
                </div>
                <button type="submit" class="submit-btn">Hesap Oluştur</button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(type) {
            const slider = document.getElementById('slider');
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const buttons = document.querySelectorAll('.tab-btn');

            if (type === 'login') {
                slider.classList.remove('register');
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
                buttons[0].classList.add('active');
                buttons[1].classList.remove('active');
            } else {
                slider.classList.add('register');
                loginForm.classList.remove('active');
                registerForm.classList.add('active');
                buttons[0].classList.remove('active');
                buttons[1].classList.add('active');
            }
        }
        
        // Eğer sayfa hata ile yüklendiyse ve hata kayıt formundan geldiyse otomatik kayıt sekmesine geç
        {% if get_flashed_messages() and 'Hesap başarıyla' not in get_flashed_messages()[0][1] %}
            // Basit bir kontrol, hata varsa register'a geç (isteğe bağlı)
        {% endif %}
    </script>
</body>
</html>
