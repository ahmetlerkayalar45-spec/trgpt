<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRGPT - Yapay Zeka Asistanı</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-main: #0a0a0f;
            --sidebar-bg: rgba(20, 20, 30, 0.6);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b8;
            --accent-1: #ff2a75; /* Neon Pembe */
            --accent-2: #7000ff; /* Elektrik Moru */
            --accent-3: #00d2ff; /* Neon Mavi */
            --bot-bg: rgba(30, 30, 45, 0.7);
            --input-bg: rgba(30, 30, 45, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 42, 117, 0.15), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(112, 0, 255, 0.15), transparent 30%),
                radial-gradient(circle at 50% 50%, rgba(0, 210, 255, 0.08), transparent 40%);
            color: var(--text-primary); 
            height: 100vh; 
            display: flex; 
            overflow: hidden; 
        }

        /* --- SOL MENÜ --- */
        #sidebar { 
            width: 280px; 
            background: var(--sidebar-bg); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex; 
            flex-direction: column; 
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
            flex-shrink: 0;
            z-index: 100;
        }
        
        #sidebar-header { padding: 20px; }
        
        .logo-container { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; padding-left: 5px; }
        .logo-svg { width: 35px; height: 35px; filter: drop-shadow(0 0 10px var(--accent-2)); }
        .logo-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(45deg, var(--accent-1), var(--accent-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #new-chat-btn { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, rgba(255, 42, 117, 0.1) 0%, rgba(112, 0, 255, 0.1) 100%);
            border: 1px solid rgba(255, 42, 117, 0.3); 
            color: white; 
            border-radius: 12px; 
            cursor: pointer; 
            text-align: left; 
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease; 
        }
        #new-chat-btn:hover { 
            background: linear-gradient(135deg, rgba(255, 42, 117, 0.2) 0%, rgba(112, 0, 255, 0.2) 100%);
            border-color: var(--accent-1);
            box-shadow: 0 0 15px rgba(255, 42, 117, 0.3);
        }
        
        #history-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }
        
        .history-item { 
            padding: 12px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 14px; 
            color: var(--text-secondary); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            transition: all 0.2s; 
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .history-item:hover { background: rgba(255, 255, 255, 0.05); color: white; }
        .history-item.active { 
            background: rgba(255, 42, 117, 0.1); 
            color: white; 
            border-left: 3px solid var(--accent-1); 
        }

        /* --- ANA EKRAN --- */
        #main { flex: 1; display: flex; flex-direction: column; position: relative; }

        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 30px 20px; 
            display: flex; 
            flex-direction: column; 
            scroll-behavior: smooth;
        }

        .message-row { width: 100%; display: flex; padding: 15px 0; animation: slideUp 0.3s ease-out; }
        .message-row.user { justify-content: flex-end; }
        .message-row.bot { justify-content: flex-start; }

        .message-content {
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 15px;
        }
        .message-row.user .message-content { justify-content: flex-end; }

        .avatar { 
            width: 38px; 
            height: 38px; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 18px; 
            flex-shrink: 0; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .bot-avatar { 
            background: linear-gradient(135deg, var(--accent-2), var(--accent-1)); 
            color: white; 
        }

        .message-text { 
            line-height: 1.7; 
            font-size: 16px; 
            color: var(--text-primary);
            word-wrap: break-word;
            padding: 14px 20px;
            border-radius: 18px;
        }

        .message-row.bot .message-text {
            background-color: var(--bot-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top-left-radius: 4px;
            backdrop-filter: blur(10px);
        }

        .message-row.user .message-text {
            background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 100%);
            border-top-right-radius: 4px;
            max-width: 75%;
            box-shadow: 0 4px 20px rgba(255, 42, 117, 0.2);
        }

        /* --- GİRİŞ ALANI VE SAYAÇ --- */
        #input-container { padding: 20px 30px 30px 30px; }
        
        .char-counter {
            max-width: 800px;
            margin: 0 auto 5px auto;
            text-align: right;
            font-size: 12px;
            color: var(--text-secondary);
            padding-right: 15px;
            font-weight: 500;
            transition: color 0.3s;
        }
        .char-counter.limit-reached {
            color: var(--accent-1);
        }

        #input-box { 
            max-width: 800px; 
            margin: 0 auto; 
            background: var(--input-bg); 
            border-radius: 20px; 
            display: flex; 
            padding: 12px 20px; 
            align-items: flex-end;
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        #input-box:focus-within {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 3px rgba(255, 42, 117, 0.2), 0 10px 30px rgba(0,0,0,0.4);
        }

        #message-input { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: white; 
            font-size: 16px; 
            resize: none; 
            outline: none; 
            max-height: 150px; 
            padding: 8px 5px; 
            line-height: 1.5;
        }
        
        #message-input::placeholder { color: #666; }

        #send-btn { 
            background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 100%); 
            border: none; 
            color: white; 
            width: 40px; 
            height: 40px; 
            border-radius: 14px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.3s; 
            margin-bottom: 2px;
        }
        #send-btn:hover { transform: scale(1.05) rotate(5deg); box-shadow: 0 0 15px var(--accent-1); }
        #send-btn:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Mobil Uyumluluk */
        #menu-btn { display: none; }
        @media (max-width: 768px) {
            #sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            #menu-btn { 
                display: flex; position: absolute; top: 20px; left: 20px; 
                background: var(--bot-bg); border: 1px solid rgba(255,255,255,0.1); 
                color: white; width: 40px; height: 40px; align-items: center; justify-content: center;
                border-radius: 10px; font-size: 18px; cursor: pointer; z-index: 50; 
            }
            #chat-container { padding-top: 80px; }
            .message-row.user .message-text { max-width: 90%; }
        }

        /* Animasyonlar */
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .typing { display: flex; gap: 5px; padding: 5px 0; align-items: center; height: 24px;}
        .dot { width: 6px; height: 6px; background: var(--accent-1); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>

    <!-- Sol Menü -->
    <div id="sidebar">
        <div id="sidebar-header">
            <div class="logo-container">
                <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 10L85 30V70L50 90L15 70V30L50 10Z" stroke="url(#paint0_linear)" stroke-width="6" fill="rgba(255, 42, 117, 0.1)"/>
                    <circle cx="50" cy="50" r="15" fill="url(#paint0_linear)"/>
                    <path d="M50 30V40M50 60V70M30 50H40M60 50H70" stroke="url(#paint0_linear)" stroke-width="4" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="paint0_linear" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#ff2a75"/>
                            <stop offset="1" stop-color="#7000ff"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span class="logo-text">TRGPT</span>
            </div>
            <button id="new-chat-btn"><i class="fas fa-plus"></i> Yeni Sohbet</button>
        </div>
        <div id="history-list"></div>
        
        <div style="padding: 20px; border-top: 1px solid rgba(255,255,255,0.05); margin-top: auto;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-3), var(--accent-2)); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white;">
                    T
                </div>
                <span style="font-weight: 600; color: white; font-size: 14px;">TRGPT Kullanıcısı</span>
            </div>
        </div>
    </div>

    <!-- Ana Ekran -->
    <div id="main">
        <button id="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        
        <div id="chat-container"></div>

        <div id="input-container">
            <!-- Karakter Sayacı -->
            <div class="char-counter" id="char-counter">0 / 300</div>
            
            <div id="input-box">
                <textarea id="message-input" rows="1" placeholder="TRGPT'ye mesaj yazın..." maxlength="300" oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
                <button id="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        let currentChatId = Date.now().toString();
        let chats = JSON.parse(localStorage.getItem('trgpt_chats')) || {};

        window.onload = () => {
            renderHistory();
            loadChat(currentChatId);
        };

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            const sortedChats = Object.keys(chats).sort((a,b) => b - a);
            
            sortedChats.forEach(id => {
                const chat = chats[id];
                if (chat.messages.length === 0) return;
                
                const div = document.createElement('div');
                div.className = `history-item ${id === currentChatId ? 'active' : ''}`;
                const firstMsg = chat.messages.find(m => m.role === 'user');
                div.innerHTML = `<i class="far fa-comment-alt"></i> <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${firstMsg ? firstMsg.content : "Yeni Sohbet"}</span>`;
                div.onclick = () => { currentChatId = id; loadChat(id); toggleSidebar(); };
                list.appendChild(div);
            });
        }

        function loadChat(id) {
            if (!chats[id]) chats[id] = { messages: [] };
            currentChatId = id;
            const container = document.getElementById('chat-container');
            container.innerHTML = '';

            if (chats[id].messages.length === 0) {
                container.innerHTML = `
                    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color: var(--text-primary); animation: slideUp 0.5s ease-out;">
                        <svg style="width: 90px; height: 90px; margin-bottom: 25px; filter: drop-shadow(0 0 25px rgba(255, 42, 117, 0.5));" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M50 10L85 30V70L50 90L15 70V30L50 10Z" stroke="url(#paint0_linear)" stroke-width="6" fill="rgba(255, 42, 117, 0.1)"/>
                            <circle cx="50" cy="50" r="15" fill="url(#paint0_linear)"/>
                            <path d="M50 30V40M50 60V70M30 50H40M60 50H70" stroke="url(#paint0_linear)" stroke-width="4" stroke-linecap="round"/>
                            <defs>
                                <linearGradient id="paint0_linear" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#ff2a75"/>
                                    <stop offset="1" stop-color="#7000ff"/>
                                </linearGradient>
                            </defs>
                        </svg>
                        <h2 style="font-size: 32px; font-weight: 800; background: linear-gradient(45deg, #fff, #a0a0b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">TRGPT'ye Hoş Geldin</h2>
                        <p style="color: var(--text-secondary); margin-top: 10px; font-size: 16px;">Bugün ne öğrenmek veya yapmak istersin?</p>
                    </div>
                `;
            } else {
                chats[id].messages.forEach(msg => {
                    appendMessage(msg.content, msg.role === 'user' ? 'user' : 'bot', false);
                });
            }
            renderHistory();
            updateCharCounter(); // Sohbet değişince sayacı sıfırla
        }

        function appendMessage(text, sender, save = true) {
            const container = document.getElementById('chat-container');
            
            if (container.children.length === 1 && container.children[0].style.flex === '1') {
                container.innerHTML = '';
            }

            const row = document.createElement('div');
            row.className = `message-row ${sender}`;
            
            if (sender === 'bot') {
                const formattedText = marked.parse(text);
                row.innerHTML = `
                    <div class="message-content">
                        <div class="avatar bot-avatar"><i class="fas fa-robot"></i></div>
                        <div class="message-text">${formattedText}</div>
                    </div>
                `;
            } else {
                row.innerHTML = `
                    <div class="message-content">
                        <div class="message-text">${text}</div>
                    </div>
                `;
            }
            
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;

            if (save) {
                if (!chats[currentChatId]) chats[currentChatId] = { messages: [] };
                chats[currentChatId].messages.push({ role: sender, content: text });
                localStorage.setItem('trgpt_chats', JSON.stringify(chats));
                renderHistory();
            }
        }

        // Karakter Sayacı Mantığı
        const messageInput = document.getElementById('message-input');
        const charCounter = document.getElementById('char-counter');
        const MAX_CHARS = 300;

        function updateCharCounter() {
            const currentLength = messageInput.value.length;
            charCounter.innerText = `${currentLength} / ${MAX_CHARS}`;
            
            if (currentLength >= MAX_CHARS) {
                charCounter.classList.add('limit-reached');
            } else {
                charCounter.classList.remove('limit-reached');
            }
        }

        messageInput.addEventListener('input', updateCharCounter);

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            messageInput.value = '';
            messageInput.style.height = 'auto';
            updateCharCounter(); // Gönderince sayacı sıfırla
            
            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;

            appendMessage(text, 'user');

            const container = document.getElementById('chat-container');
            const typingRow = document.createElement('div');
            typingRow.className = 'message-row bot';
            typingRow.id = 'typing-indicator';
            typingRow.innerHTML = `
                <div class="message-content">
                    <div class="avatar bot-avatar"><i class="fas fa-robot"></i></div>
                    <div class="message-text"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
                </div>
            `;
            container.appendChild(typingRow);
            container.scrollTop = container.scrollHeight;

            try {
                const history = chats[currentChatId].messages.slice(-10);
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: history })
                });
                
                const data = await res.json();
                document.getElementById('typing-indicator').remove();

                if (data.reply) {
                    appendMessage(data.reply, 'bot');
                } else {
                    appendMessage("Hata: " + (data.error || "Bilinmeyen bir sorun oluştu."), 'bot');
                }
            } catch (e) {
                document.getElementById('typing-indicator').remove();
                appendMessage("Bağlantı hatası oluştu.", 'bot');
            }

            sendBtn.disabled = false;
            messageInput.focus();
        }

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.getElementById('new-chat-btn').onclick = () => {
            currentChatId = Date.now().toString();
            loadChat(currentChatId);
            toggleSidebar();
        };
    </script>
</body>
</html>
