<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRGPT - Yapay Zeka Asistanı</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!-- Markdown Desteği -->
    <style>
        :root {
            --bg-main: #0d0d12;
            --sidebar-bg: rgba(20, 20, 28, 0.7);
            --text-primary: #ffffff;
            --text-secondary: #9e9eb3;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --user-bubble: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --bot-bg: #1c1c24;
            --input-bg: #1c1c24;
            --border-glow: rgba(99, 102, 241, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            background-image: radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.08), transparent 25%);
            color: var(--text-primary); 
            height: 100vh; 
            display: flex; 
            overflow: hidden; 
        }

        /* --- SOL MENÜ (Cam Efektli) --- */
        #sidebar { 
            width: 280px; 
            background: var(--sidebar-bg); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex; 
            flex-direction: column; 
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            z-index: 100;
        }
        
        #sidebar-header { padding: 20px; }
        
        /* LOGO TASARIMI */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            padding-left: 5px;
        }
        .logo-svg {
            width: 35px;
            height: 35px;
            filter: drop-shadow(0 0 8px var(--accent));
        }
        .logo-text {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #new-chat-btn { 
            width: 100%; 
            padding: 14px; 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: white; 
            border-radius: 12px; 
            cursor: pointer; 
            text-align: left; 
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s; 
        }
        #new-chat-btn:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--accent); }
        
        #history-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }
        
        .history-item { 
            padding: 12px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 14px; 
            color: var(--text-secondary); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            transition: all 0.2s; 
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .history-item:hover { background: rgba(255, 255, 255, 0.05); color: white; }
        .history-item.active { background: rgba(99, 102, 241, 0.15); color: var(--accent); border-left: 3px solid var(--accent); }

        /* --- ANA EKRAN --- */
        #main { flex: 1; display: flex; flex-direction: column; position: relative; }

        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 30px 20px; 
            display: flex; 
            flex-direction: column; 
            scroll-behavior: smooth;
        }

        .message-row { width: 100%; display: flex; padding: 15px 0; }
        .message-row.user { justify-content: flex-end; }
        .message-row.bot { justify-content: flex-start; }

        .message-content {
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 15px;
        }
        .message-row.user .message-content { justify-content: flex-end; }

        /* Avatarlar */
        .avatar { 
            width: 36px; 
            height: 36px; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 18px; 
            flex-shrink: 0; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .bot-avatar { background: var(--accent); color: white; }
        .user-avatar { display: none; }

        /* Mesaj Metinleri */
        .message-text { 
            line-height: 1.7; 
            font-size: 16px; 
            color: var(--text-primary);
            word-wrap: break-word;
            padding: 12px 18px;
            border-radius: 16px;
        }

        .message-row.bot .message-text {
            background-color: var(--bot-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-top-left-radius: 4px;
        }

        .message-row.user .message-text {
            background: var(--user-bubble);
            border-top-right-radius: 4px;
            max-width: 75%;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
        }

        /* --- GİRİŞ ALANI --- */
        #input-container { padding: 20px 30px 30px 30px; }
        
        #input-box { 
            max-width: 800px; 
            margin: 0 auto; 
            background: var(--input-bg); 
            border-radius: 20px; 
            display: flex; 
            padding: 12px 20px; 
            align-items: flex-end;
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            transition: all 0.3s;
        }
        
        #input-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--border-glow), 0 10px 30px rgba(0,0,0,0.3);
        }

        #message-input { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: white; 
            font-size: 16px; 
            resize: none; 
            outline: none; 
            max-height: 150px; 
            padding: 8px 5px; 
            line-height: 1.5;
            font-family: inherit;
        }
        
        #message-input::placeholder { color: #666; }

        #send-btn { 
            background: var(--accent); 
            border: none; 
            color: white; 
            width: 38px; 
            height: 38px; 
            border-radius: 12px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.2s; 
            margin-bottom: 2px;
        }
        #send-btn:hover { background: var(--accent-hover); transform: scale(1.05); }
        #send-btn:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; }

        /* Mobil Uyumluluk */
        #menu-btn { display: none; }

        @media (max-width: 768px) {
            #sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            #menu-btn { 
                display: flex; 
                position: absolute; 
                top: 20px; 
                left: 20px; 
                background: var(--bot-bg); 
                border: 1px solid rgba(255,255,255,0.1); 
                color: white; 
                width: 40px;
                height: 40px;
                align-items: center;
                justify-content: center;
                border-radius: 10px;
                font-size: 18px; 
                cursor: pointer; 
                z-index: 50; 
            }
            #chat-container { padding-top: 80px; }
            .message-row.user .message-text { max-width: 90%; }
            #input-container { padding: 15px; }
        }

        /* Yazıyor Animasyonu */
        .typing { display: flex; gap: 5px; padding: 5px 0; align-items: center; height: 24px;}
        .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>

    <!-- Sol Menü -->
    <div id="sidebar">
        <div id="sidebar-header">
            <div class="logo-container">
                <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 10L85 30V70L50 90L15 70V30L50 10Z" stroke="url(#paint0_linear)" stroke-width="6" fill="rgba(99, 102, 241, 0.1)"/>
                    <circle cx="50" cy="50" r="15" fill="url(#paint0_linear)"/>
                    <path d="M50 30V40M50 60V70M30 50H40M60 50H70" stroke="url(#paint0_linear)" stroke-width="4" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="paint0_linear" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#6366f1"/>
                            <stop offset="1" stop-color="#a855f7"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span class="logo-text">TRGPT</span>
            </div>
            
            <button id="new-chat-btn"><i class="fas fa-plus"></i> Yeni sohbet</button>
        </div>
        <div id="history-list">
            <!-- Geçmiş dinamik olarak eklenecek -->
        </div>
        
        <!-- Kullanıcı Profili kısmı (Hesap sistemi silindiği için sadece dekoratif) -->
        <div style="padding: 20px; border-top: 1px solid rgba(255,255,255,0.05); margin-top: auto;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold;">
                    T
                </div>
                <span style="font-weight: 600; color: white; font-size: 14px;">TRGPT Kullanıcısı</span>
            </div>
        </div>
    </div>

    <!-- Ana Ekran -->
    <div id="main">
        <button id="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        
        <div id="chat-container">
            <!-- Mesajlar dinamik olarak eklenecek -->
        </div>

        <div id="input-container">
            <div id="input-box">
                <textarea id="message-input" rows="1" placeholder="TRGPT'ye mesaj yazın..." oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
                <button id="send-btn" onclick="sendMessage()"><i class="fas fa-arrow-up"></i></button>
            </div>
        </div>
    </div>

    <script>
        let currentChatId = Date.now().toString();
        let chats = JSON.parse(localStorage.getItem('trgpt_chats')) || {};

        window.onload = () => {
            renderHistory();
            loadChat(currentChatId);
        };

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            const sortedChats = Object.keys(chats).sort((a,b) => b - a);
            
            sortedChats.forEach(id => {
                const chat = chats[id];
                if (chat.messages.length === 0) return;
                
                const div = document.createElement('div');
                div.className = `history-item ${id === currentChatId ? 'active' : ''}`;
                const firstMsg = chat.messages.find(m => m.role === 'user');
                div.innerHTML = `<i class="far fa-comment-alt"></i> <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${firstMsg ? firstMsg.content : "Yeni Sohbet"}</span>`;
                div.onclick = () => { currentChatId = id; loadChat(id); toggleSidebar(); };
                list.appendChild(div);
            });
        }

        function loadChat(id) {
            if (!chats[id]) chats[id] = { messages: [] };
            currentChatId = id;
            const container = document.getElementById('chat-container');
            container.innerHTML = '';

            if (chats[id].messages.length === 0) {
                container.innerHTML = `
                    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color: var(--text-primary);">
                        <svg style="width: 80px; height: 80px; margin-bottom: 20px; filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.5));" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M50 10L85 30V70L50 90L15 70V30L50 10Z" stroke="url(#paint0_linear)" stroke-width="6" fill="rgba(99, 102, 241, 0.1)"/>
                            <circle cx="50" cy="50" r="15" fill="url(#paint0_linear)"/>
                            <path d="M50 30V40M50 60V70M30 50H40M60 50H70" stroke="url(#paint0_linear)" stroke-width="4" stroke-linecap="round"/>
                            <defs>
                                <linearGradient id="paint0_linear" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#6366f1"/>
                                    <stop offset="1" stop-color="#a855f7"/>
                                </linearGradient>
                            </defs>
                        </svg>
                        <h2 style="font-size: 28px; font-weight: 700; background: linear-gradient(to right, #fff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">TRGPT'ye Hoş Geldin</h2>
                        <p style="color: var(--text-secondary); margin-top: 10px;">Bugün ne öğrenmek veya yapmak istersin?</p>
                    </div>
                `;
            } else {
                chats[id].messages.forEach(msg => {
                    appendMessage(msg.content, msg.role === 'user' ? 'user' : 'bot', false);
                });
            }
            renderHistory();
        }

        function appendMessage(text, sender, save = true) {
            const container = document.getElementById('chat-container');
            
            if (container.children.length === 1 && container.children[0].style.flex === '1') {
                container.innerHTML = '';
            }

            const row = document.createElement('div');
            row.className = `message-row ${sender}`;
            
            if (sender === 'bot') {
                // Markdown desteği (kalın yazılar vs. için)
                const formattedText = marked.parse(text);
                row.innerHTML = `
                    <div class="message-content">
                        <div class="avatar bot-avatar"><i class="fas fa-robot"></i></div>
                        <div class="message-text">${formattedText}</div>
                    </div>
                `;
            } else {
                row.innerHTML = `
                    <div class="message-content">
                        <div class="message-text">${text}</div>
                    </div>
                `;
            }
            
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;

            if (save) {
                if (!chats[currentChatId]) chats[currentChatId] = { messages: [] };
                chats[currentChatId].messages.push({ role: sender, content: text });
                localStorage.setItem('trgpt_chats', JSON.stringify(chats));
                renderHistory();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            input.style.height = 'auto';
            appendMessage(text, 'user');
            sendBtn.disabled = true;

            const container = document.getElementById('chat-container');
            const typingRow = document.createElement('div');
            typingRow.className = 'message-row bot';
            typingRow.id = 'typing-indicator';
            typingRow.innerHTML = `
                <div class="message-content">
                    <div class="avatar bot-avatar"><i class="fas fa-robot"></i></div>
                    <div class="message-text"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
                </div>
            `;
            container.appendChild(typingRow);
            container.scrollTop = container.scrollHeight;

            try {
                const history = chats[currentChatId].messages.slice(-10);

                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: history })
                });
                
                const data = await res.json();
                document.getElementById('typing-indicator').remove();

                if (data.reply) {
                    appendMessage(data.reply, 'bot');
                } else {
                    appendMessage("Hata: " + (data.error || "Bilinmeyen bir sorun oluştu."), 'bot');
                }
            } catch (e) {
                document.getElementById('typing-indicator').remove();
                appendMessage("Bağlantı hatası oluştu.", 'bot');
            }

            sendBtn.disabled = false;
            input.focus();
        }

        document.getElementById('message-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.getElementById('new-chat-btn').onclick = () => {
            currentChatId = Date.now().toString();
            loadChat(currentChatId);
            toggleSidebar();
        };
    </script>
</body>
</html>
