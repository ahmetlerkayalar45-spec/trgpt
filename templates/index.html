<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRGPT - Yapay Zeka Asistanı</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #212121; --sidebar: #171717; --input-bg: #2f2f2f; --text: #ececec; --accent: #1976d2; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

        /* Sol Menü (Sohbet Geçmişi) */
        #sidebar { width: 260px; background-color: var(--sidebar); display: flex; flex-direction: column; border-right: 1px solid #333; transition: transform 0.3s ease; }
        #sidebar-header { padding: 15px; }
        #new-chat-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid #444; color: white; border-radius: 8px; cursor: pointer; text-align: left; font-weight: 600; transition: background 0.2s; }
        #new-chat-btn:hover { background: #2a2a2a; }
        #history-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
        .history-item { padding: 10px; border-radius: 8px; cursor: pointer; font-size: 14px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.2s; }
        .history-item:hover { background: #2a2a2a; color: white; }
        .history-item.active { background: #333; color: white; }

        /* Ana Ekran */
        #main { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; scroll-behavior: smooth; }
        .message-wrapper { max-width: 800px; width: 100%; margin: 0 auto; display: flex; gap: 15px; margin-bottom: 25px; }
        .avatar { width: 30px; height: 30px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .user-avatar { background: #1976d2; }
        .bot-avatar { background: #10a37f; }
        .message { line-height: 1.6; font-size: 16px; padding-top: 5px; }
        .bot .message { color: #ececec; }
        .user .message { color: #ececec; }

        /* Giriş Alanı */
        #input-container { padding: 20px; background: linear-gradient(180deg, transparent, var(--bg) 20%); }
        #input-box { max-width: 800px; margin: 0 auto; background: var(--input-bg); border-radius: 12px; display: flex; padding: 10px 15px; align-items: center; border: 1px solid #444; box-shadow: 0 0 15px rgba(0,0,0,0.2); }
        #message-input { flex: 1; background: transparent; border: none; color: white; font-size: 16px; resize: none; outline: none; max-height: 200px; padding: 5px 0; }
        #send-btn { background: var(--accent); border: none; color: white; width: 35px; height: 35px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        #send-btn:hover { background: #1565c0; }
        #send-btn:disabled { background: #444; cursor: not-allowed; }

        /* Mobil Uyumluluk */
        @media (max-width: 768px) {
            #sidebar { position: absolute; height: 100%; z-index: 10; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            #menu-btn { display: block; position: absolute; top: 15px; left: 15px; background: transparent; border: none; color: white; font-size: 20px; cursor: pointer; z-index: 20; }
        }
        @media (min-width: 769px) { #menu-btn { display: none; } }

        /* Animasyonlar */
        .typing { display: flex; gap: 4px; padding: 10px 0; }
        .dot { width: 6px; height: 6px; background: #888; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Sol Menü -->
    <div id="sidebar">
        <div id="sidebar-header">
            <button id="new-chat-btn"><i class="fas fa-plus"></i> Yeni Sohbet</button>
        </div>
        <div id="history-list">
            <!-- Geçmiş buraya gelecek -->
        </div>
    </div>

    <!-- Ana Ekran -->
    <div id="main">
        <button id="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        
        <div id="chat-container">
            <!-- Mesajlar buraya gelecek -->
        </div>

        <div id="input-container">
            <div id="input-box">
                <textarea id="message-input" rows="1" placeholder="TRGPT'ye bir şey sorun..." oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
                <button id="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        let currentChatId = Date.now().toString();
        let chats = JSON.parse(localStorage.getItem('trgpt_chats')) || {};

        // Sayfa yüklendiğinde geçmişi getir
        window.onload = () => {
            renderHistory();
            loadChat(currentChatId);
        };

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            const sortedChats = Object.keys(chats).sort((a,b) => b - a);
            
            sortedChats.forEach(id => {
                const chat = chats[id];
                if (chat.messages.length === 0) return;
                
                const div = document.createElement('div');
                div.className = `history-item ${id === currentChatId ? 'active' : ''}`;
                const firstMsg = chat.messages.find(m => m.role === 'user');
                div.innerText = firstMsg ? firstMsg.content : "Yeni Sohbet";
                div.onclick = () => { currentChatId = id; loadChat(id); toggleSidebar(); };
                list.appendChild(div);
            });
        }

        function loadChat(id) {
            if (!chats[id]) chats[id] = { messages: [] };
            currentChatId = id;
            const container = document.getElementById('chat-container');
            container.innerHTML = '';

            if (chats[id].messages.length === 0) {
                appendMessage('Merhaba! Ben TRGPT. Sana bugün nasıl yardımcı olabilirim?', 'bot');
            } else {
                chats[id].messages.forEach(msg => {
                    appendMessage(msg.content, msg.role === 'user' ? 'user' : 'bot', false);
                });
            }
            renderHistory();
        }

        function appendMessage(text, sender, save = true) {
            const container = document.getElementById('chat-container');
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender}`;
            
            const icon = sender === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';
            const avatarClass = sender === 'user' ? 'user-avatar' : 'bot-avatar';

            wrapper.innerHTML = `
                <div class="avatar ${avatarClass}">${icon}</div>
                <div class="message">${text}</div>
            `;
            
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;

            if (save) {
                if (!chats[currentChatId]) chats[currentChatId] = { messages: [] };
                chats[currentChatId].messages.push({ role: sender, content: text });
                localStorage.setItem('trgpt_chats', JSON.stringify(chats));
                renderHistory();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            input.style.height = '';
            appendMessage(text, 'user');
            sendBtn.disabled = true;

            // Yazıyor animasyonu
            const container = document.getElementById('chat-container');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message-wrapper bot';
            typingDiv.id = 'typing-indicator';
            typingDiv.innerHTML = `
                <div class="avatar bot-avatar"><i class="fas fa-robot"></i></div>
                <div class="message"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
            `;
            container.appendChild(typingDiv);
            container.scrollTop = container.scrollHeight;

            try {
                // API'ye gönderirken geçmişi de yolla (Hafıza için)
                const history = chats[currentChatId].messages.slice(-10); // Son 10 mesajı hatırla

                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: history })
                });
                
                const data = await res.json();
                document.getElementById('typing-indicator').remove();

                if (data.reply) {
                    appendMessage(data.reply, 'bot');
                } else {
                    appendMessage("Hata: " + (data.error || "Bilinmeyen bir sorun oluştu."), 'bot');
                }
            } catch (e) {
                document.getElementById('typing-indicator').remove();
                appendMessage("Bağlantı hatası oluştu.", 'bot');
            }

            sendBtn.disabled = false;
            input.focus();
        }

        // Enter ile gönderme
        document.getElementById('message-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Yeni Sohbet Butonu
        document.getElementById('new-chat-btn').onclick = () => {
            currentChatId = Date.now().toString();
            loadChat(currentChatId);
            toggleSidebar();
        };
    </script>
</body>
</html>
