<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRGPT</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #212121;
            --sidebar-bg: #171717;
            --text-primary: #ececec;
            --text-secondary: #b4b4b4;
            --border-color: #333;
            --user-bubble: #2f2f2f;
            --input-bg: #2f2f2f;
            --hover-color: #2a2a2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            height: 100vh; 
            display: flex; 
            overflow: hidden; 
        }

        /* --- SOL MENÜ (SIDEBAR) --- */
        #sidebar { 
            width: 260px; 
            background-color: var(--sidebar-bg); 
            display: flex; 
            flex-direction: column; 
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }
        
        #sidebar-header { padding: 15px; }
        
        #new-chat-btn { 
            width: 100%; 
            padding: 12px; 
            background: transparent; 
            border: 1px solid var(--border-color); 
            color: white; 
            border-radius: 8px; 
            cursor: pointer; 
            text-align: left; 
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s; 
        }
        #new-chat-btn:hover { background: var(--hover-color); }
        
        #history-list { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
        }
        
        .history-item { 
            padding: 10px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px; 
            color: var(--text-secondary); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            transition: background 0.2s; 
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .history-item:hover { background: var(--hover-color); color: white; }
        .history-item.active { background: var(--hover-color); color: white; }

        /* --- ANA EKRAN --- */
        #main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            max-width: 100%;
        }

        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px 0; 
            display: flex; 
            flex-direction: column; 
        }

        /* ChatGPT Tarzı Mesaj Baloncukları */
        .message-row { 
            width: 100%;
            display: flex;
            padding: 15px 20px;
        }
        .message-row.bot { background-color: transparent; }
        .message-row.user { background-color: transparent; justify-content: flex-end; }

        .message-content {
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 15px;
            margin: 0 auto;
        }
        
        .message-row.user .message-content {
            justify-content: flex-end;
        }

        /* Avatarlar */
        .avatar { 
            width: 30px; 
            height: 30px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 16px; 
            flex-shrink: 0; 
        }
        .bot-avatar { background: #10a37f; color: white; } /* ChatGPT Yeşili */
        .user-avatar { display: none; } /* Kullanıcı avatarı ChatGPT'de genelde gizlidir */

        /* Mesaj Metni */
        .message-text { 
            line-height: 1.6; 
            font-size: 16px; 
            color: var(--text-primary);
            word-wrap: break-word;
        }

        /* Kullanıcı Mesaj Baloncuğu */
        .message-row.user .message-text {
            background-color: var(--user-bubble);
            padding: 10px 20px;
            border-radius: 20px;
            max-width: 70%;
        }

        /* --- GİRİŞ ALANI (INPUT) --- */
        #input-container { 
            padding: 20px; 
            background: linear-gradient(180deg, transparent, var(--bg-color) 20%); 
        }
        
        #input-box { 
            max-width: 800px; 
            margin: 0 auto; 
            background: var(--input-bg); 
            border-radius: 25px; 
            display: flex; 
            padding: 10px 15px; 
            align-items: flex-end; /* Çok satırlı yazı için */
            border: 1px solid transparent; 
            box-shadow: 0 0 15px rgba(0,0,0,0.1); 
        }
        
        #input-box:focus-within {
            border-color: #555;
        }

        #message-input { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: white; 
            font-size: 16px; 
            resize: none; 
            outline: none; 
            max-height: 200px; 
            padding: 8px 5px; 
            line-height: 1.5;
            font-family: inherit;
        }
        
        #message-input::placeholder { color: #888; }

        #send-btn { 
            background: white; 
            border: none; 
            color: black; 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: background 0.2s; 
            margin-bottom: 4px;
        }
        #send-btn:hover { background: #ccc; }
        #send-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

        /* Mobil Uyumluluk */
        #menu-btn { display: none; }

        @media (max-width: 768px) {
            #sidebar { position: absolute; height: 100%; z-index: 100; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            #menu-btn { 
                display: block; 
                position: absolute; 
                top: 15px; 
                left: 15px; 
                background: transparent; 
                border: none; 
                color: white; 
                font-size: 20px; 
                cursor: pointer; 
                z-index: 50; 
            }
            .message-content { max-width: 100%; }
            .message-row.user .message-text { max-width: 90%; }
        }

        /* Yazıyor Animasyonu */
        .typing { display: flex; gap: 4px; padding: 10px 0; align-items: center; height: 24px;}
        .dot { width: 6px; height: 6px; background: #888; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Sol Menü -->
    <div id="sidebar">
        <div id="sidebar-header">
            <button id="new-chat-btn"><i class="fas fa-plus"></i> Yeni sohbet</button>
        </div>
        <div id="history-list">
            <!-- Geçmiş dinamik olarak eklenecek -->
        </div>
    </div>

    <!-- Ana Ekran -->
    <div id="main">
        <button id="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        
        <div id="chat-container">
            <!-- Mesajlar dinamik olarak eklenecek -->
        </div>

        <div id="input-container">
            <div id="input-box">
                <textarea id="message-input" rows="1" placeholder="TRGPT'ye mesaj yazın..." oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
                <button id="send-btn" onclick="sendMessage()"><i class="fas fa-arrow-up"></i></button>
            </div>
        </div>
    </div>

    <script>
        let currentChatId = Date.now().toString();
        let chats = JSON.parse(localStorage.getItem('trgpt_chats')) || {};

        window.onload = () => {
            renderHistory();
            loadChat(currentChatId);
        };

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            const sortedChats = Object.keys(chats).sort((a,b) => b - a);
            
            sortedChats.forEach(id => {
                const chat = chats[id];
                if (chat.messages.length === 0) return;
                
                const div = document.createElement('div');
                div.className = `history-item ${id === currentChatId ? 'active' : ''}`;
                const firstMsg = chat.messages.find(m => m.role === 'user');
                
                // ChatGPT'deki gibi ikon ve başlık
                div.innerHTML = `<i class="far fa-comment-alt"></i> <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${firstMsg ? firstMsg.content : "Yeni Sohbet"}</span>`;
                div.onclick = () => { currentChatId = id; loadChat(id); toggleSidebar(); };
                list.appendChild(div);
            });
        }

        function loadChat(id) {
            if (!chats[id]) chats[id] = { messages: [] };
            currentChatId = id;
            const container = document.getElementById('chat-container');
            container.innerHTML = '';

            if (chats[id].messages.length === 0) {
                // Karşılama ekranı (Ortalanmış)
                container.innerHTML = `
                    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color: var(--text-primary);">
                        <div style="width: 50px; height: 50px; background: #10a37f; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 20px;">
                            <i class="fas fa-robot" style="color: white;"></i>
                        </div>
                        <h2 style="font-size: 24px; font-weight: 600;">Size nasıl yardımcı olabilirim?</h2>
                    </div>
                `;
            } else {
                chats[id].messages.forEach(msg => {
                    appendMessage(msg.content, msg.role === 'user' ? 'user' : 'bot', false);
                });
            }
            renderHistory();
        }

        function appendMessage(text, sender, save = true) {
            const container = document.getElementById('chat-container');
            
            // Eğer karşılama ekranı varsa temizle
            if (container.children.length === 1 && container.children[0].style.flex === '1') {
                container.innerHTML = '';
            }

            const row = document.createElement('div');
            row.className = `message-row ${sender}`;
            
            if (sender === 'bot') {
                row.innerHTML = `
                    <div class="message-content">
                        <div class="avatar bot-avatar"><i class="fas fa-robot"></i></div>
                        <div class="message-text">${text}</div>
                    </div>
                `;
            } else {
                row.innerHTML = `
                    <div class="message-content">
                        <div class="message-text">${text}</div>
                    </div>
                `;
            }
            
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;

            if (save) {
                if (!chats[currentChatId]) chats[currentChatId] = { messages: [] };
                chats[currentChatId].messages.push({ role: sender, content: text });
                localStorage.setItem('trgpt_chats', JSON.stringify(chats));
                renderHistory();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            input.style.height = 'auto';
            appendMessage(text, 'user');
            sendBtn.disabled = true;

            const container = document.getElementById('chat-container');
            const typingRow = document.createElement('div');
            typingRow.className = 'message-row bot';
            typingRow.id = 'typing-indicator';
            typingRow.innerHTML = `
                <div class="message-content">
                    <div class="avatar bot-avatar"><i class="fas fa-robot"></i></div>
                    <div class="message-text"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
                </div>
            `;
            container.appendChild(typingRow);
            container.scrollTop = container.scrollHeight;

            try {
                const history = chats[currentChatId].messages.slice(-10);

                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: history })
                });
                
                const data = await res.json();
                document.getElementById('typing-indicator').remove();

                if (data.reply) {
                    appendMessage(data.reply, 'bot');
                } else {
                    appendMessage("Hata: " + (data.error || "Bilinmeyen bir sorun oluştu."), 'bot');
                }
            } catch (e) {
                document.getElementById('typing-indicator').remove();
                appendMessage("Bağlantı hatası oluştu.", 'bot');
            }

            sendBtn.disabled = false;
            input.focus();
        }

        // Enter ile gönderme (Shift+Enter alt satıra geçer)
        document.getElementById('message-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.getElementById('new-chat-btn').onclick = () => {
            currentChatId = Date.now().toString();
            loadChat(currentChatId);
            toggleSidebar();
        };
    </script>
</body>
</html>
